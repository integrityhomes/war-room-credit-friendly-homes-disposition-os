[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "war-room-credit-friendly-homes-disposition-os"
version = "0.2.0"
description = "Owner-finance disposition, marketing, buyer growth, and compliance operating system."
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "streamlit>=1.42,<2",
  "supabase>=2.15,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/cfh_disposition/buyer_intent.py" = ["F401"]
"pages/14_AI_Creative_Winner_Rotation.py" = ["F401"]
