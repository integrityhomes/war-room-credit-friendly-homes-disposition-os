name: Deploy CommandCore Receiver

on:
  workflow_dispatch:
  push:
    branches:
      - agent/commandcore-direct-channel-receiver
    paths:
      - "supabase/functions/commandcore-channel-receiver/**"
      - ".github/workflows/deploy-commandcore-receiver.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy CommandCore receiver
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-channel-receiver --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
