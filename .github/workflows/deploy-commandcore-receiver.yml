name: Deploy CommandCore Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/commandcore-direct-channel-receiver
      - agent/commandcore-dispatcher
      - agent/commandcore-dispatch-worker
      - agent/commandcore-market-seo-adapter
      - agent/commandcore-approval-engine
      - agent/commandcore-communication-delivery-gate
      - agent/commandcore-contact-consent-ledger
      - agent/commandcore-buyer-matcher
      - agent/commandcore-buyer-preferences
      - agent/commandcore-lead-intake
      - agent/commandcore-lead-source-adapters
      - agent/commandcore-public-lead-gateway
      - agent/commandcore-hosted-property-lead-form
      - agent/commandcore-property-link-generator
      - agent/commandcore-campaign-lead-links
      - agent/commandcore-marketing-copy-packages
      - agent/commandcore-dispatch-copy-packages
      - agent/commandcore-outbound-prep
      - agent/commandcore-outbound-prep-dispatch-integration
      - agent/commandcore-adapter-connection-registry
      - agent/commandcore-outbound-connection-gate
      - agent/commandcore-execution-readiness-engine
      - agent/commandcore-readiness-dispatch-integration
    paths:
      - "supabase/functions/commandcore-channel-receiver/**"
      - "supabase/functions/commandcore-dispatch-worker/**"
      - "supabase/functions/commandcore-market-seo/**"
      - "supabase/functions/commandcore-approval-engine/**"
      - "supabase/functions/commandcore-communication-gate/**"
      - "supabase/functions/commandcore-contact-ledger/**"
      - "supabase/functions/commandcore-buyer-matcher/**"
      - "supabase/functions/commandcore-buyer-profile/**"
      - "supabase/functions/commandcore-lead-intake/**"
      - "supabase/functions/commandcore-lead-source-adapter/**"
      - "supabase/functions/commandcore-public-lead-gateway/**"
      - "supabase/functions/commandcore-property-link/**"
      - "supabase/functions/commandcore-marketing-copy/**"
      - "supabase/functions/commandcore-outbound-prep/**"
      - "supabase/functions/commandcore-adapter-registry/**"
      - "supabase/functions/commandcore-execution-readiness/**"
      - ".github/workflows/deploy-commandcore-receiver.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy CommandCore functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-channel-receiver --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-market-seo --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-dispatch-worker --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-approval-engine --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-contact-ledger --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-buyer-profile --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-buyer-matcher --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-lead-intake --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-lead-source-adapter --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-public-lead-gateway --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-property-link --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-marketing-copy --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-outbound-prep --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-adapter-registry --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-execution-readiness --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-communication-gate --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify CommandCore function health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          check_health() {
            NAME="$1"
            URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/${NAME}"
            for attempt in 1 2 3 4 5; do
              RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
              if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
                echo "$NAME health check passed."
                return 0
              fi
              echo "$NAME not ready yet (attempt $attempt/5)."
              sleep 3
            done
            echo "$NAME health check failed."
            return 1
          }

          check_health commandcore-channel-receiver
          check_health commandcore-market-seo
          check_health commandcore-dispatch-worker
          check_health commandcore-approval-engine
          check_health commandcore-contact-ledger
          check_health commandcore-buyer-profile
          check_health commandcore-buyer-matcher
          check_health commandcore-lead-intake
          check_health commandcore-lead-source-adapter
          check_health commandcore-public-lead-gateway
          check_health commandcore-property-link
          check_health commandcore-marketing-copy
          check_health commandcore-outbound-prep
          check_health commandcore-adapter-registry
          check_health commandcore-execution-readiness
          check_health commandcore-communication-gate
