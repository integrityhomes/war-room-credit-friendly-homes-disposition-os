name: Deploy CommandCore Receiver

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/commandcore-direct-channel-receiver
      - agent/commandcore-dispatcher
    paths:
      - "supabase/functions/commandcore-channel-receiver/**"
      - ".github/workflows/deploy-commandcore-receiver.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy CommandCore receiver
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-channel-receiver --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify CommandCore receiver health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          RECEIVER_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-channel-receiver"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --silent --show-error --fail "$RECEIVER_URL" || true)"
            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "CommandCore receiver health check passed."
              exit 0
            fi
            echo "Receiver not ready yet (attempt $attempt/5)."
            sleep 3
          done
          echo "CommandCore receiver health check failed."
          exit 1
