name: Deploy CommandCore Closing Dispo Handoff

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-closing-dispo-handoff/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy closing dispo handoff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-closing-dispo-handoff --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Verify health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-closing-dispo-handoff"
          curl --silent --show-error --fail "$URL" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("closing_evidence_required") is True; assert data.get("ownership_or_control_confirmation_required") is True; assert data.get("marketing_execution_started") is False; assert data.get("external_execution_enabled") is False; print("health=ok")'
