name: Deploy CommandCore Owner Approval Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/functions/commandcore-owner-approval-release/**"
      - ".github/workflows/deploy-commandcore-owner-approval-release.yml"
      - "tests/test_commandcore_owner_approval_release.py"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/commandcore-owner-approval-release/**"
      - ".github/workflows/deploy-commandcore-owner-approval-release.yml"
      - "tests/test_commandcore_owner_approval_release.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check owner approval release
        run: deno check supabase/functions/commandcore-owner-approval-release/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy owner approval release
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-owner-approval-release --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify idempotent release health contract
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-owner-approval-release"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
            if echo "$RESPONSE" | python -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("ok") is True and data.get("version") == "2026-08-29.2" and data.get("idempotent_release_enabled") is True and data.get("stable_release_timestamp_enabled") is True and data.get("external_execution_enabled") is False else 1)' 2>/dev/null; then
              echo "health=ok version=2026-08-29.2 idempotent_release=enabled stable_timestamp=enabled"
              exit 0
            fi
            echo "Owner approval release not ready yet (attempt $attempt/5)."
            sleep 3
          done
          echo "Owner approval release health contract failed."
          exit 1
