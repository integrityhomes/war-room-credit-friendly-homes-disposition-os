name: Deploy CommandCore CRM Import Commit

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-crm-import-commit/**"
      - ".github/workflows/deploy-commandcore-crm-import-commit.yml"
      - "tests/test_commandcore_crm_import_preview.py"
      - "tests/test_commandcore_crm_full_history_migration.py"
  pull_request:
    paths:
      - "supabase/functions/commandcore-crm-import-commit/**"
      - ".github/workflows/deploy-commandcore-crm-import-commit.yml"
      - "tests/test_commandcore_crm_import_preview.py"
      - "tests/test_commandcore_crm_full_history_migration.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check function
        run: deno check supabase/functions/commandcore-crm-import-commit/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-crm-import-commit --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Health check
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-crm-import-commit"
          response="$(curl --fail --silent --show-error "$URL")"
          printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("status") == "healthy"; assert data.get("live_migration_preview_enabled") is True; assert data.get("signed_preview_required_for_apply") is True; assert data.get("pre_apply_backup_required") is True; assert data.get("explicit_update_permission_required") is True; assert len(data.get("supported_entities",[])) == 9'
      - name: Verify full-history live dry-run canary
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-crm-import-commit"
          response="$(curl --silent --show-error --fail \
            -X POST "$URL" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"apply":false,"rows":[{"approved":true,"entity":"activities","record":{"source":"deployment-canary","external_id":"commandcore-import-commit-history-canary","activity_type":"note","notes":"Canary history row","source_payload":{"Legacy Extra Field":"preserve-me"}}}]}')"
          printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("apply_requested") is False; assert data.get("live_preview_ok") is True; assert data.get("approved_rows") == 1; assert data.get("apply_guard_ready") is True; assert isinstance(data.get("preview_token"),str) and len(data.get("preview_token")) > 40; assert data.get("records_written") == 0; assert data.get("source_records_modified") is False; assert data.get("destructive_delete_used") is False; assert data.get("external_action_started") is False; activities=data.get("entities",{}).get("activities",{}); assert activities.get("rows") == 1; print("crm_import_full_history_guard=verified would_create=%s would_update=%s" % (data.get("would_create",0),data.get("would_update",0)))'
