name: CommandCore Auto Rebalance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - name: Run strict safe automatic rebalance
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co"
          RESPONSE="$(curl --silent --show-error --fail \
            -X POST "${BASE_URL}/functions/v1/commandcore-auto-rebalance" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"apply":true}')"

          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | python -c '
import json, sys
result = json.load(sys.stdin)
if result.get("ok") is not True:
    raise SystemExit("CommandCore auto rebalance did not return ok=true")
print(f"Eligible: {result.get(chr(101)+chr(108)+chr(105)+chr(103)+chr(105)+chr(98)+chr(108)+chr(101)+chr(95)+chr(108)+chr(111)+chr(119)+chr(95)+chr(114)+chr(105)+chr(115)+chr(107)+chr(95)+chr(104)+chr(105)+chr(103)+chr(104)+chr(95)+chr(99)+chr(111)+chr(110)+chr(102)+chr(105)+chr(100)+chr(101)+chr(110)+chr(99)+chr(101), 0)}; Applied: {result.get(chr(97)+chr(112)+chr(112)+chr(108)+chr(105)+chr(101)+chr(100)+chr(95)+chr(99)+chr(111)+chr(117)+chr(110)+chr(116), 0)}; Skipped: {len(result.get(chr(115)+chr(107)+chr(105)+chr(112)+chr(112)+chr(101)+chr(100), []))}")
'
