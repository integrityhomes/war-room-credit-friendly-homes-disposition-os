name: CommandCore Auto Rebalance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/commandcore-auto-rebalance.yml"

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - name: Run strict safe automatic rebalance
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)

          BASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co"
          APPLY="true"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            APPLY="false"
          fi

          RESPONSE="$(curl --silent --show-error --fail \
            -X POST "${BASE_URL}/functions/v1/commandcore-auto-rebalance" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"apply\":${APPLY}}")"

          printf '%s\n' "$RESPONSE"
          APPLY_EXPECTED="$APPLY" RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          result = json.loads(os.environ["RESPONSE"])
          expected = os.environ["APPLY_EXPECTED"] == "true"
          assert result.get("ok") is True
          assert result.get("apply_requested") is expected
          assert result.get("assignment_only") is True
          assert result.get("readiness_changed") is False
          assert result.get("approval_changed") is False
          assert result.get("consent_changed") is False
          assert result.get("external_action_started") is False
          if not expected:
              assert result.get("applied_count") == 0
          print(
              "mode=%s eligible=%s applied=%s skipped=%s"
              % (
                  "apply" if expected else "dry-run",
                  result.get("eligible_low_risk_high_confidence", 0),
                  result.get("applied_count", 0),
                  len(result.get("skipped", [])),
              )
          )
          PY

          BUCKET="commandcore-auto-rebalance-audit"
          CREATE_STATUS="$(curl --silent --output /tmp/commandcore_bucket_create.txt --write-out '%{http_code}' \
            -X POST "${BASE_URL}/storage/v1/bucket" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --data "{\"id\":\"${BUCKET}\",\"name\":\"${BUCKET}\",\"public\":false}")"
          if [ "$CREATE_STATUS" != "200" ] && [ "$CREATE_STATUS" != "201" ] && [ "$CREATE_STATUS" != "409" ]; then
            echo "Could not ensure audit bucket: HTTP ${CREATE_STATUS}"
            cat /tmp/commandcore_bucket_create.txt
            exit 1
          fi

          RUN_AT="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          AUDIT_PATH="runs/${RUN_AT}-${GITHUB_EVENT_NAME}-${GITHUB_RUN_ID}.json"
          curl --silent --show-error --fail \
            -X POST "${BASE_URL}/storage/v1/object/${BUCKET}/${AUDIT_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "x-upsert: false" \
            --data "$RESPONSE" >/dev/null
          echo "Audit saved: ${AUDIT_PATH}"
