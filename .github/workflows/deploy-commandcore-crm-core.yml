name: Deploy CommandCore CRM Core

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-crm-core/**"
      - ".github/workflows/deploy-commandcore-crm-core.yml"
      - "tests/test_commandcore_crm_migration_preview.py"
  pull_request:
    paths:
      - "supabase/functions/commandcore-crm-core/**"
      - ".github/workflows/deploy-commandcore-crm-core.yml"
      - "tests/test_commandcore_crm_migration_preview.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check function
        run: deno check supabase/functions/commandcore-crm-core/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-crm-core --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Health check
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-crm-core"
          response="$(curl --fail --silent --show-error "$URL")"
          printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("status") == "healthy"; assert data.get("migration_preview_enabled") is True; assert data.get("migration_bulk_apply_enabled") is False'
      - name: Verify read-only migration preview
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-crm-core"
          response="$(curl --silent --show-error --fail \
            -X POST "$URL" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"action":"migration_preview","entity":"contacts","source":"deployment-canary","records":[{"external_id":"commandcore-migration-preview-canary"}]}')"
          printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("action") == "migration_preview"; assert data.get("valid_count") == 1; assert data.get("records_written") == 0; assert data.get("source_records_modified") is False; assert data.get("migration_bulk_apply_enabled") is False; assert data.get("destructive_action_started") is False; assert data.get("external_action_started") is False; print("migration_preview=verified would_create=%s would_update=%s" % (data.get("would_create",0), data.get("would_update",0)))'
