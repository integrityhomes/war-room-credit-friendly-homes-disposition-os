name: Shutdown Center Autofix

on:
  push:
    branches:
      - agent/property-shutdown-buyer-reroute

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/property-shutdown-buyer-reroute
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install "ruff==0.16.1"
      - name: Apply safe fixes
        run: |
          ruff check --fix pages/18_Property_Shutdown_Buyer_Reroute.py src/cfh_disposition/property_shutdown.py
          python - <<'PY'
          from pathlib import Path

          path = Path("pages/18_Property_Shutdown_Buyer_Reroute.py")
          text = path.read_text(encoding="utf-8")
          old = '''st.warning(
              "Saving Pending, Filled, Sold, or Paused immediately removes the property from the Credit Friendly Homes public portal. External platforms are not treated as stopped until their task or publishing-workflow result is confirmed."
          )'''
          new = '''st.warning(
              "Saving Pending, Filled, Sold, or Paused immediately removes the property "
              "from the Credit Friendly Homes public portal. External platforms are not "
              "treated as stopped until their task or publishing-workflow result is confirmed."
          )'''
          if old not in text:
              raise SystemExit("Expected warning text was not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          ruff format pages/18_Property_Shutdown_Buyer_Reroute.py src/cfh_disposition/property_shutdown.py
          ruff check pages/18_Property_Shutdown_Buyer_Reroute.py src/cfh_disposition/property_shutdown.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/18_Property_Shutdown_Buyer_Reroute.py src/cfh_disposition/property_shutdown.py
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "Fix shutdown center lint"
            git push origin HEAD:agent/property-shutdown-buyer-reroute
          fi
