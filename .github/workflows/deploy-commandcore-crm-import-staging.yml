name: Deploy CommandCore CRM Import Staging

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-crm-import-staging/**"
      - ".github/workflows/deploy-commandcore-crm-import-staging.yml"
      - "tests/test_commandcore_crm_import_preview.py"
  pull_request:
    paths:
      - "supabase/functions/commandcore-crm-import-staging/**"
      - ".github/workflows/deploy-commandcore-crm-import-staging.yml"
      - "tests/test_commandcore_crm_import_preview.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check function
        run: deno check supabase/functions/commandcore-crm-import-staging/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-crm-import-staging --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Health check
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-crm-import-staging"
          response="$(curl --fail --silent --show-error "$URL")"
          printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("status") == "healthy"; assert data.get("commit_enabled") is False'
      - name: Verify non-writing staging canary
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-crm-import-staging"
          response="$(curl --silent --show-error --fail \
            -X POST "$URL" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"source":"deployment-canary","entity":"contacts","rows":[{"Contact ID":"staging-canary-contact","First Name":"Canary"}]}')"
          printf '%s' "$response" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("input_rows") == 1; assert data.get("staged_rows") == 1; assert data.get("commit_performed") is False; assert data.get("destructive_delete_used") is False; assert data.get("external_action_started") is False; print("crm_import_staging=verified")'
