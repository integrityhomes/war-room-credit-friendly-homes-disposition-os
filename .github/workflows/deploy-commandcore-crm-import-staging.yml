name: Deploy CommandCore CRM Import Staging

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-crm-import-staging/**"
      - ".github/workflows/deploy-commandcore-crm-import-staging.yml"
  pull_request:
    paths:
      - "supabase/functions/commandcore-crm-import-staging/**"
      - ".github/workflows/deploy-commandcore-crm-import-staging.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check function
        run: deno check supabase/functions/commandcore-crm-import-staging/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy commandcore-crm-import-staging --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: curl --fail --silent --show-error "$SUPABASE_URL/functions/v1/commandcore-crm-import-staging"
