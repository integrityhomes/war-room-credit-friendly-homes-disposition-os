name: CommandCore Launch Readiness

on:
  workflow_dispatch:
  schedule:
    - cron: "42 * * * *"

jobs:
  verify-launch-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CommandCore critical service chain
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-launch-readiness"
          RESPONSE="$(curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$URL")"
          echo "$RESPONSE" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("launch_ready") is True; assert data.get("failed_required_count") == 0; assert data.get("external_action_started") is False; print("healthy_service_count=", data.get("healthy_service_count"))'
