name: CommandCore Deal Lifecycle Coordination

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  coordinate:
    runs-on: ubuntu-latest
    steps:
      - name: Coordinate open deal lifecycle work
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-deal-lifecycle-coordinator"
          RESPONSE="$(curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"apply":true}' \
            "$URL")"
          echo "$RESPONSE" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; print("candidate_count=", data.get("candidate_count", 0), "routed_count=", data.get("routed_count", 0), "needs_owner_count=", data.get("needs_owner_count", 0))'
