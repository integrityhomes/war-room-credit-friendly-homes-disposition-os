name: Deploy CommandCore Inbound Lead Capture

on:
  workflow_dispatch:
  push:
    branches:
      - agent/commandcore-inbound-lead-capture
    paths:
      - "supabase/functions/commandcore-inbound-lead-capture/**"
      - ".github/workflows/deploy-commandcore-inbound-lead-capture.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy inbound lead capture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-inbound-lead-capture --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-inbound-lead-capture"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "Inbound lead capture health check passed."
              exit 0
            fi
            echo "Inbound lead capture not ready yet (attempt $attempt/5)."
            sleep 3
          done
          echo "Inbound lead capture health check failed."
          exit 1
