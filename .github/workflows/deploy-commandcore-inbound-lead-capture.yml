name: Deploy CommandCore Inbound Lead Capture

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/commandcore-inbound-lead-capture
      - commandcore-inbound-auto-assignment
    paths:
      - "supabase/functions/commandcore-inbound-lead-capture/**"
      - ".github/workflows/deploy-commandcore-inbound-lead-capture.yml"
  pull_request:
    paths:
      - "supabase/functions/commandcore-inbound-lead-capture/**"
      - ".github/workflows/deploy-commandcore-inbound-lead-capture.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check inbound lead capture
        run: deno check supabase/functions/commandcore-inbound-lead-capture/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy inbound lead capture
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-inbound-lead-capture --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify health and assignment boundary
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-inbound-lead-capture"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
            if RESPONSE="$RESPONSE" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RESPONSE"] or "{}")
          assert data.get("ok") is True
          assert data.get("status") == "healthy"
          assert data.get("automatic_owner_routing") is True
          assert data.get("external_assignment_override_allowed") is False
          assert data.get("internal_assignment_override_requires_service_role") is True
          assert data.get("external_execution_enabled") is False
          PY
            then
              echo "Inbound lead capture health and assignment boundary passed."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Inbound lead capture did not become healthy with the expected assignment boundary."
              exit 1
            fi
            sleep 3
          done

      - name: Verify unauthenticated lead cannot write
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-inbound-lead-capture"
          STATUS="$(curl --silent --output /tmp/inbound_unauthorized.json --write-out '%{http_code}' \
            -X POST "$URL" \
            -H "Content-Type: application/json" \
            --data '{"lead":{"name":"Synthetic Unauthorized Probe","property_address":"1 Test Only Lane","assigned_to":"should-never-write"}}')"
          test "$STATUS" = "401" || (echo "Expected HTTP 401; got $STATUS" && cat /tmp/inbound_unauthorized.json && exit 1)
          python - <<'PY'
          import json

          with open("/tmp/inbound_unauthorized.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data.get("ok") is False
          assert data.get("error") == "unauthorized"
          print("unauthenticated_write_blocked=true")
          PY
