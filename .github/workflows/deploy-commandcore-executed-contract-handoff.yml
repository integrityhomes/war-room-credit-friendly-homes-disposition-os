name: Deploy CommandCore Executed Contract Handoff

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-executed-contract-handoff/**"
      - ".github/workflows/deploy-commandcore-executed-contract-handoff.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy executed contract handoff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-executed-contract-handoff --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Verify health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-executed-contract-handoff"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "Executed contract handoff health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "Executed contract handoff health check failed."
          exit 1
