name: Deploy CommandCore Team Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/commandcore-team-routing-registry
    paths:
      - "supabase/functions/commandcore-team-registry/**"
      - ".github/workflows/deploy-commandcore-team-registry.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy team registry
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-team-registry --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify team registry health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-team-registry"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "commandcore-team-registry health check passed."
              exit 0
            fi
            echo "commandcore-team-registry not ready yet (attempt $attempt/5)."
            sleep 3
          done
          echo "commandcore-team-registry health check failed."
          exit 1
