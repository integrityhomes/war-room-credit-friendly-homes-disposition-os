name: Deploy CommandCore Launch Readiness

on:
  pull_request:
    paths:
      - "supabase/functions/commandcore-launch-readiness/**"
      - ".github/workflows/deploy-commandcore-launch-readiness.yml"
      - "tests/test_commandcore_crm_cutover_readiness.py"
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-launch-readiness/**"
      - ".github/workflows/deploy-commandcore-launch-readiness.yml"
      - "tests/test_commandcore_crm_cutover_readiness.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check launch readiness auditor
        run: deno check supabase/functions/commandcore-launch-readiness/index.ts

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy launch readiness auditor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-launch-readiness --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Verify auditor health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-launch-readiness"
          curl --silent --show-error --fail "$URL" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("live_chain_check_requires_authentication") is True; assert data.get("crm_cutover_assessment_included") is True; assert data.get("crm_source_reconciliation_included") is True; assert data.get("external_execution_enabled") is False; print("health=ok")'
      - name: Verify complete CommandCore operating chain and CRM cutover guard
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-launch-readiness"
          for attempt in $(seq 1 12); do
            RESPONSE="$(curl --silent --show-error --fail \
              -X POST "$URL" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              --data '{}')"
            if printf '%s' "$RESPONSE" | python -c 'import json,sys; data=json.load(sys.stdin); cutover=data.get("crm_cutover") or {}; raise SystemExit(0 if cutover.get("reconciliation_service_healthy") is True else 1)'; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "CRM reconciliation service did not become healthy in the deployment window"
              exit 1
            fi
            sleep 5
          done
          printf '%s' "$RESPONSE" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("launch_ready") is True; assert data.get("failed_required_count") == 0; cutover=data.get("crm_cutover"); assert isinstance(cutover,dict); assert cutover.get("complete_mapping_coverage") is True; assert cutover.get("unsupported_migration_entities") == []; assert cutover.get("reconciliation_service_healthy") is True; assert cutover.get("crm_cutover_ready") is False; assert cutover.get("source_crm_data_reconciliation_verified") is False; assert "source_crm_data_reconciliation_not_verified" in cutover.get("blockers",[]); assert data.get("external_action_started") is False; assert data.get("destructive_action_started") is False; assert data.get("owner_approval_bypassed") is False; print("full_chain=ready migration_coverage=complete crm_cutover_ready=false reconciliation=pending")'
