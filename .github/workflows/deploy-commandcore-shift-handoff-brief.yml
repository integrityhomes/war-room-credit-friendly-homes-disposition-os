name: Deploy CommandCore Shift Handoff Brief

on:
  workflow_dispatch:
  push:
    branches:
      - agent/commandcore-shift-briefs
      - main
    paths:
      - "supabase/functions/commandcore-shift-handoff-brief/**"
      - "supabase/functions/commandcore-handoff-ledger/**"
      - ".github/workflows/deploy-commandcore-shift-handoff-brief.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy shift handoff functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-handoff-ledger --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy commandcore-shift-handoff-brief --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify shift handoff health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          check_health() {
            NAME="$1"
            URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/${NAME}"
            for attempt in 1 2 3 4 5; do
              RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
              if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
                echo "$NAME health check passed."
                return 0
              fi
              echo "$NAME not ready yet (attempt $attempt/5)."
              sleep 3
            done
            echo "$NAME health check failed."
            return 1
          }

          check_health commandcore-handoff-ledger
          check_health commandcore-shift-handoff-brief
