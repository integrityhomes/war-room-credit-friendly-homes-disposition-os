name: Deploy CommandCore Deal Flow Orchestrator

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/commandcore-deal-flow-orchestrator/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-deal-flow-orchestrator --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Verify health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-deal-flow-orchestrator"
          curl --silent --show-error --fail "$URL" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True; assert data.get("external_execution_enabled") is False; assert data.get("consequential_approval_bypass_enabled") is False; print("health=ok")'
