name: Deploy CommandCore Stage Intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/commandcore-stage-intelligence
    paths:
      - "supabase/functions/commandcore-stage-intelligence/**"
      - ".github/workflows/deploy-commandcore-stage-intelligence.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy stage intelligence service
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy commandcore-stage-intelligence --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Verify health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/commandcore-stage-intelligence"
          for attempt in 1 2 3 4 5; do
            RESPONSE="$(curl --silent --show-error --fail "$URL" || true)"
            if echo "$RESPONSE" | grep -q '"status":"healthy"'; then
              echo "Stage intelligence health check passed."
              exit 0
            fi
            echo "Stage intelligence not ready yet (attempt $attempt/5)."
            sleep 3
          done
          echo "Stage intelligence health check failed."
          exit 1
